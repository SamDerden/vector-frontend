name: Backend checks
on:
  pull_request:
  push:
    branches: [main, integration/backend-2026-11-07]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check graph internal catalog integrity
        run: node scripts/check-catalog-integrity.mjs
      - name: Audit Navigator EKB v3 workbook vs graph (read-only)
        run: node scripts/audit-excel-v3-vs-graph.mjs
      - name: Detect active v1 Excel references
        run: node scripts/audit-v1-references.mjs
      - name: Backend typecheck
        run: npm run typecheck
      - name: Backend session and API tests
        run: npm test
      - name: Backend production build
        run: npm run build
