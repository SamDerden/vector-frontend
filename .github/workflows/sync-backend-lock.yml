name: Synchronize backend npm lockfile
on:
  push:
    paths:
      - .github/workflows/sync-backend-lock.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile with npm ci
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): synchronize backend package-lock.json"
            git push origin HEAD:main
          fi
