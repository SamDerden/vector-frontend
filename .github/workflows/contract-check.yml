name: API contract regressions
on:
  pull_request:
  push:
    branches: [integration/backend-2026-11-07]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend-contract.test.mjs
