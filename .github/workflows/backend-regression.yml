name: Backend automated regression tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run all backend unit and integration-mock tests
        run: npm test
