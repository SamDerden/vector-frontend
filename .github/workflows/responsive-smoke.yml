name: Responsive visual and interaction smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/responsive-smoke.mjs'
      - '.github/workflows/responsive-smoke.yml'
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Build and start frontend
        run: |
          npm run build
          npm run start > /tmp/vector-next.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3001/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/vector-next.log
          exit 1
      - run: node tests/responsive-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: test-results/responsive
